# Starkvisionz — nginx site, behind a Cloudflare Tunnel.
#
# `__PORT__` is replaced by deploy/install.sh. The difference from nginx.conf is
# the whole point of the tunnel mode:
#
#   - It listens on loopback only. Nothing reaches this machine from outside;
#     cloudflared dials out to Cloudflare and traffic arrives back down that
#     connection. Ports 80 and 443 are never opened, which is also why this
#     works on a host whose inbound 80/443 is intercepted upstream.
#   - There is no TLS here and no certbot. Cloudflare terminates TLS for the
#     hostname, so the certificate is theirs to issue and renew.

server {
    # Loopback, deliberately. Binding 0.0.0.0 here would expose an origin with
    # no TLS and no certificate to anyone who found the address.
    listen 127.0.0.1:__TUNNEL_PORT__;
    server_name _;

    # Bigger than the import route's own 12MB cap, so an oversized file is
    # refused by the app with an explanation rather than by nginx with a 413.
    # Cloudflare has its own upload ceiling that varies by plan and applies
    # first; on the free plan it is 100MB, comfortably above this.
    client_max_body_size 13m;

    # The registers hold a project's commercial position. Say so to the browser.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    access_log /var/log/nginx/starkvisionz.access.log;
    error_log  /var/log/nginx/starkvisionz.error.log;

    # ---------------------------------------------------------------------
    # Who the caller is.
    #
    # The rate limiter keys on the client address, so getting this wrong
    # either lumps every caller into one bucket or lets one caller forge a
    # fresh bucket per request.
    #
    # `CF-Connecting-IP` is set by Cloudflare to the real client address, and
    # Cloudflare overwrites any value a client tries to send — so through the
    # tunnel it cannot be forged. X-Forwarded-For is *replaced* with it rather
    # than appended to, so the chain the app sees is exactly one entry long no
    # matter how many hops Cloudflare and cloudflared add between them. That
    # pairs with STARKVISIONZ_TRUSTED_PROXIES=1.
    #
    # This is only safe because nothing but cloudflared can reach this server:
    # it is on loopback, and no inbound port is open.
    # ---------------------------------------------------------------------
    set $client_ip $http_cf_connecting_ip;

    # The agent panel streams server-sent events. Buffering here would hold the
    # whole answer until the turn finished, which looks exactly like a hang.
    location /api/chat {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        # Cloudflare terminated TLS, so the browser's scheme is https even
        # though this hop is not.
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        # An agent turn can think for a while before the first token.
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 60s;
    }
}
