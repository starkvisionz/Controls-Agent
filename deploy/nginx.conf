# Starkvisionz — nginx site.
#
# `__DOMAIN__` is replaced by deploy/install.sh. Certbot rewrites this file when
# it issues a certificate, adding the TLS server block and the redirect; what is
# here is the plain-HTTP version it starts from.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Bigger than the import route's own 12MB cap, so an oversized file is
    # refused by the app with an explanation rather than by nginx with a 413.
    client_max_body_size 13m;

    # The registers hold a project's commercial position. Say so to the browser.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    access_log /var/log/nginx/starkvisionz.access.log;
    error_log  /var/log/nginx/starkvisionz.error.log;

    # The agent panel streams server-sent events. Buffering here would hold the
    # whole answer until the turn finished, which looks exactly like a hang.
    location /api/chat {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        # An agent turn can think for a while before the first token.
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The app trusts the LAST entry of this header, and only because
        # STARKVISIONZ_TRUSTED_PROXIES says there is exactly one proxy — this
        # one. Putting another proxy in front without raising that number would
        # key every caller's rate limit on the wrong address.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 60s;
    }
}
